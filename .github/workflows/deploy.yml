name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/-ReflexRAG
            git pull origin main
            sudo /usr/bin/python3.11 -m pip install -r backend/requirements.txt -q
            sudo systemctl restart reflexrag
            echo "Deploy complete"
